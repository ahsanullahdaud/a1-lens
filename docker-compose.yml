services:
  db:
    image: postgres:17-alpine
    container_name: a1lens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: a1lens
      POSTGRES_PASSWORD: a1lens
      POSTGRES_DB: a1lens
    ports:
      - "5432:5432"
    volumes:
      - a1lens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a1lens -d a1lens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a1lens-pgdata:
